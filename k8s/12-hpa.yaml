apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cadastro-hpa
  namespace: oficina-mecanica
  labels:
    app: cadastro
    app.kubernetes.io/part-of: oficina-mecanica
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cadastro
  # Maximo de 3 replicas por servico: o node group do cluster e dimensionado para os cinco
  # servicos escalando ate esse teto.
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
